[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -m "not slow and not data and not eval and not benchmark and not e2e"
markers =
    case: registers a conformance case. Read by tests/conftest.py, which applies the tier skips and the declared xfails.
    fast: needs the runtime dependencies only - no model weights, no dataset, no network.
    slow: needs the CLIP model weights.
    data: needs the local corpus.
    eval: needs the labelled evaluation sets.
    benchmark: needs the candidate models and corpora.
    e2e: needs the full local stack.
